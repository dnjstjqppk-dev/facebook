name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test:
    name: Backend Go Test & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Go Tidy & Check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run Go Unit & Integration Tests
        run: |
          go test -race -v -coverprofile=coverage.out ./services/...
