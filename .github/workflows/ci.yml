name: Master CI Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test:
    name: Go Microservices Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Go Unit & Integration Tests
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./services/...

      - name: Compile Go Service Binaries
        run: |
          mkdir -p bin
          go build -o bin/api-gateway ./services/api-gateway/cmd/server
          go build -o bin/identity-service ./services/identity/cmd/server

  frontend-check:
    name: Web Frontend Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Verify Workspace Config
        run: |
          node -e "console.log('Monorepo workspace valid')"
